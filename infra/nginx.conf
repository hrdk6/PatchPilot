# Serves the built dashboard and proxies the API.
#
# ${PATCHPILOT_API_URL} is substituted by the nginx image's envsubst template
# handling at container start.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Client-side routing: unknown paths fall through to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${PATCHPILOT_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indexing and sandboxed runs are queued, but a slow response must not be
        # cut off mid-flight.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
