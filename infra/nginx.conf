# Serves the built dashboard and proxies the API.
#
# ${PATCHPILOT_API_URL} is substituted by the nginx image's envsubst template
# handling at container start. Only variables defined in the environment are
# substituted, so nginx's own $variables below are left alone.

# One id per request, end to end: a client's X-Correlation-Id is passed through,
# otherwise nginx's $request_id is used, so an nginx log line and the API's log
# lines for the same request share an id.
map $http_x_correlation_id $patchpilot_correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The largest legitimate request is a run with a pasted issue (<= 100 kB).
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Dashboard security headers. add_header is not inherited by a location that
    # sets its own, so each dashboard location repeats them; the API sets its own.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Client-side routing: unknown paths fall through to the SPA. index.html is
    # never cached, so a deploy takes effect on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Vite fingerprints every asset name, so assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass ${PATCHPILOT_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $patchpilot_correlation_id;

        # Indexing and sandboxed runs are queued, but a slow response must not be
        # cut off mid-flight.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
