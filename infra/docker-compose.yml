# PatchPilot local stack: API + worker, Qdrant, and the dashboard.
#
#   docker compose -f infra/docker-compose.yml up --build
#
# Then open http://localhost:5173 for the dashboard and http://localhost:8000/docs
# for the API. No API key is needed: the default model is a deterministic test
# double and the default embedder runs locally.
#
# Note on the sandbox: the api container mounts the host Docker socket so it can
# create sibling sandbox containers. That is a real privilege grant -- anyone who
# can reach that socket has root-equivalent access to the host. It is appropriate
# for a local developer machine and NOT for a shared or production host. See
# docs/security.md. To run without it, set PATCHPILOT_SANDBOX_BACKEND=local and
# accept that generated code then runs unisolated inside the api container.

name: patchpilot

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The image has no curl or wget, so this speaks HTTP to /readyz over
      # bash's /dev/tcp. It must run under bash explicitly: CMD-SHELL uses
      # /bin/sh, which is dash on this Debian-based image and has no /dev/tcp,
      # so the check would fail forever and the api service would never start.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PATCHPILOT_ENVIRONMENT: local
      PATCHPILOT_LOG_JSON: "true"
      PATCHPILOT_DATABASE_URL: sqlite+pysqlite:////data/patchpilot.db
      PATCHPILOT_DATA_DIR: /data
      PATCHPILOT_QDRANT_URL: http://qdrant:6333
      PATCHPILOT_EMBEDDING_PROVIDER: hash
      PATCHPILOT_DEFAULT_MODEL: mock:deterministic
      PATCHPILOT_SANDBOX_BACKEND: auto
      PATCHPILOT_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Optional: uncomment in .env and pass through to compare real models.
      PATCHPILOT_OPENAI_API_KEY: ${PATCHPILOT_OPENAI_API_KEY:-}
      PATCHPILOT_ANTHROPIC_API_KEY: ${PATCHPILOT_ANTHROPIC_API_KEY:-}
      PATCHPILOT_GITHUB_TOKEN: ${PATCHPILOT_GITHUB_TOKEN:-}
    volumes:
      - patchpilot-data:/data
      # Sandbox containers are siblings of this one, created through the host
      # daemon. Read docs/security.md before running this anywhere shared.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    environment:
      PATCHPILOT_API_URL: http://api:8000

volumes:
  qdrant-storage:
  patchpilot-data:
