# Alembic configuration. The database URL is injected at runtime from
# PATCHPILOT_DATABASE_URL so migrations always target the same database the app
# uses; the placeholder below is only here to satisfy tooling.
[alembic]
script_location = patchpilot_api/alembic
prepend_sys_path = .
sqlalchemy.url = sqlite+pysqlite:///./patchpilot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
